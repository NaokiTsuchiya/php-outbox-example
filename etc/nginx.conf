server {
    listen 80;
    root /app/public;
    index index.php;

    # HAL JSON をデフォルト Accept にする
    add_header Content-Type "application/hal+json; charset=utf-8" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
