services:

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: outbox_demo
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─────────────────────────────────────────
  # Webアプリ（BEAR.Sunday + PHP-FPM）
  # スケールアウト可能（× N）
  # ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    environment:
      DB_HOST: db
      DB_NAME: outbox_demo
      DB_USER: app
      DB_PASSWORD: secret
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - ./var:/app/var

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - .:/app
    depends_on:
      - app

  # ─────────────────────────────────────────
  # Pump（BEAR.Sunday CLI・常に単一）
  # Webアプリと同じ AppModule を使うため
  # DI設定・バインディングを共有できる
  # ─────────────────────────────────────────
  pump:
    build:
      context: .
      dockerfile: Dockerfile.pump
    environment:
      DB_HOST: db
      DB_NAME: outbox_demo
      DB_USER: app
      DB_PASSWORD: secret
      REDIS_HOST: redis
      CONSUMER_ENDPOINT: http://consumer:8081
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      consumer:
        condition: service_started
    volumes:
      - ./var:/app/var
    restart: unless-stopped

  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    ports:
      - "8081:8081"

volumes:
  db_data:
