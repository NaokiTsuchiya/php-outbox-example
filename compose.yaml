services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: outbox_demo
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticmq:
    image: softwaremill/elasticmq:latest
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./etc/elasticmq.conf:/opt/elasticmq.conf
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:9324"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: components/producer
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_NAME: outbox_demo
      DB_USER: app
      DB_PASSWORD: secret
      REDIS_HOST: redis
      OUTBOX_CHANNEL: "outbox:notify"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./etc/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  pump:
    build:
      context: components/pump
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_NAME: outbox_demo
      DB_USER: app
      DB_PASSWORD: secret
      REDIS_HOST: redis
      OUTBOX_CHANNEL: "outbox:notify"
      SQS_ENDPOINT: http://elasticmq:9324
      SQS_QUEUE_URL: http://elasticmq:9324/000000000000/outbox-events.fifo
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticmq:
        condition: service_healthy
    restart: unless-stopped

  consumer:
    build:
      context: components/consumer
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_NAME: outbox_demo
      DB_USER: app
      DB_PASSWORD: secret
      SQS_ENDPOINT: http://elasticmq:9324
      SQS_QUEUE_URL: http://elasticmq:9324/000000000000/outbox-events.fifo
    depends_on:
      db:
        condition: service_healthy
      elasticmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
