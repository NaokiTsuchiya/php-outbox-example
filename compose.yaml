services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: outbox_demo
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: components/producer
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_NAME: outbox_demo
      DB_USER: app
      DB_PASSWORD: secret
      REDIS_HOST: redis
      OUTBOX_CHANNEL: "outbox:notify"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./components/producer/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  pump:
    build:
      context: components/pump
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_NAME: outbox_demo
      DB_USER: app
      DB_PASSWORD: secret
      REDIS_HOST: redis
      OUTBOX_CHANNEL: "outbox:notify"
      CONSUMER_ENDPOINT: http://consumer:8081
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      consumer:
        condition: service_started
    restart: unless-stopped

  consumer:
    build:
      context: components/consumer
      dockerfile: Dockerfile
    ports:
      - "8081:8081"

volumes:
  db_data:
